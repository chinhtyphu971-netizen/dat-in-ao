<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đặt số lượng may</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧵</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f2f0e9;
    --paper-raised: #ffffff;
    --ink: #211f1a;
    --ink-soft: #63594a;
    --line: #ddd7c8;
    --denim: #33506e;
    --thread: #d99a2b;
    --thread-soft: #f3d99a;
    --stitch: #b0523f;
    --ok: #4a7a4f;
    --radius-tag: 10px;
    --radius-pill: 999px;
    --shadow-card: 0 1px 0 rgba(33,31,26,0.05), 0 6px 16px -10px rgba(33,31,26,0.25);
    --font-display: 'Space Grotesk', system-ui, sans-serif;
    --font-body: 'Inter', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--paper); color: var(--ink); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 780px; margin: 0 auto; padding: 20px 16px 64px; }

  /* ---- auth screen ---- */
  .auth-wrap { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
  .auth-card { width: 100%; max-width: 360px; background: var(--paper-raised); border: 1px solid var(--line); border-radius: var(--radius-tag); box-shadow: var(--shadow-card); padding: 28px 24px; }
  .auth-card h1 { font-family: var(--font-display); font-weight: 700; font-size: 22px; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
  .auth-card h1 .tag-dot { width: 11px; height: 11px; border-radius: 3px; background: var(--thread); display: inline-block; transform: rotate(45deg); flex-shrink: 0; }
  .auth-card p.sub { font-size: 13.5px; color: var(--ink-soft); margin: 0 0 20px; line-height: 1.5; }
  .auth-field { margin-bottom: 14px; }
  .auth-field label { display: block; font-size: 13px; color: var(--ink-soft); margin-bottom: 5px; }
  .auth-field input { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 15px; font-family: var(--font-body); background: var(--paper); color: var(--ink); }
  .auth-field input:focus-visible { outline: 2px solid var(--denim); outline-offset: 1px; }
  .auth-note { font-size: 12px; color: var(--ink-soft); margin-top: 14px; line-height: 1.5; }
  .auth-error { font-size: 13px; color: var(--stitch); margin-top: 10px; display: none; }
  .auth-error.show { display: block; }

  .app-layout { display: flex; min-height: 100%; align-items: stretch; }
  .sidebar {
    width: 232px; flex-shrink: 0; background: var(--paper-raised); border-right: 1px solid var(--line);
    padding: 24px 16px; display: flex; flex-direction: column; gap: 22px;
    position: sticky; top: 0; align-self: flex-start; height: 100vh; height: 100dvh;
    padding-top: calc(24px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  }
  .sidebar-brand h1 { font-family: var(--font-display); font-weight: 700; font-size: 19px; letter-spacing: -0.01em; margin: 0; display: flex; align-items: center; gap: 8px; line-height: 1.3; }
  .sidebar-brand h1 .tag-dot { width: 11px; height: 11px; border-radius: 3px; background: var(--thread); display: inline-block; transform: rotate(45deg); flex-shrink: 0; }
  .tabs-vertical { display: flex; flex-direction: column; gap: 2px; flex: 1; }
  .tabs-vertical button {
    text-align: left; font-family: var(--font-body); font-weight: 600; font-size: 14.5px;
    background: none; border: none; border-left: 3px solid transparent; color: var(--ink-soft);
    padding: 11px 12px; cursor: pointer; border-radius: 0 8px 8px 0;
  }
  .tabs-vertical button.active { color: var(--ink); border-color: var(--stitch); background: var(--paper); }
  .tabs-vertical button:hover { color: var(--ink); }
  .sidebar-who { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); padding-top: 14px; }
  .sidebar-who .who-name { font-size: 14px; font-weight: 600; }
  .sidebar-who .role-chip { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: var(--radius-pill); background: var(--thread-soft); color: #6b4a00; align-self: flex-start; }
  .sidebar-who .role-chip.manager { background: var(--denim); color: #fff; }
  .sidebar-who button { align-self: flex-start; border: none; background: none; color: var(--ink-soft); font-size: 12.5px; font-weight: 600; padding: 4px 0; cursor: pointer; text-decoration: underline; }

  .main-content { flex: 1; min-width: 0; max-width: 780px; padding: 24px 20px 64px; padding-top: calc(24px + env(safe-area-inset-top, 0px)); }
  .main-subtitle { margin-bottom: 22px; }
  h1 { font-family: var(--font-display); font-weight: 700; font-size: 26px; letter-spacing: -0.01em; margin: 0 0 4px; display: flex; align-items: center; gap: 10px; }
  h1 .tag-dot { width: 12px; height: 12px; border-radius: 3px; background: var(--thread); display: inline-block; transform: rotate(45deg); flex-shrink: 0; }
  .subtitle { color: var(--ink-soft); font-size: 14.5px; margin: 0; }

  @media (max-width: 720px) {
    .app-layout { flex-direction: column; }
    .sidebar { width: 100%; height: auto; position: static; flex-direction: row; align-items: center; padding: 12px 14px; padding-top: calc(12px + env(safe-area-inset-top, 0px)); gap: 12px; }
    .sidebar-brand { flex-shrink: 0; }
    .sidebar-brand h1 span:not(.tag-dot) { display: none; }
    .tabs-vertical { flex-direction: row; overflow-x: auto; flex: 1; gap: 4px; }
    .tabs-vertical button { border-left: none; border-bottom: 3px solid transparent; border-radius: 8px 8px 0 0; white-space: nowrap; padding: 9px 10px; }
    .tabs-vertical button.active { border-color: var(--stitch); }
    .sidebar-who { flex-direction: row; align-items: center; border-top: none; border-left: 1px solid var(--line); padding-top: 0; padding-left: 12px; gap: 10px; flex-shrink: 0; }
    .sidebar-who .who-name { display: none; }
    .main-content { padding: 18px 16px 64px; }
  }

  section.view { display: none; }
  section.view.active { display: block; }

  .empty { padding: 40px 20px; text-align: center; color: var(--ink-soft); border: 1.5px dashed var(--line); border-radius: var(--radius-tag); font-size: 14.5px; line-height: 1.6; }
  .day-note { font-size: 13px; color: var(--ink-soft); margin: -4px 0 14px; }
  .day-note b { color: var(--ink); }

  .product-card { background: var(--paper-raised); border: 1px solid var(--line); border-radius: var(--radius-tag); box-shadow: var(--shadow-card); margin-bottom: 16px; overflow: hidden; }
  .product-card .pc-head { display: flex; gap: 12px; padding: 14px; align-items: flex-start; }
  .pc-thumb { width: 104px; height: 104px; border-radius: 10px; object-fit: cover; background: var(--paper); border: 1px solid var(--line); flex-shrink: 0; }
  .pc-thumb.placeholder { display: flex; align-items: center; justify-content: center; color: var(--ink-soft); font-size: 11px; text-align: center; }
  .pc-title { font-family: var(--font-display); font-weight: 600; font-size: 16.5px; margin: 0 0 4px; }
  .pc-meta { font-size: 12.5px; color: var(--ink-soft); }
  .pc-headtext { flex: 1; min-width: 0; }
  .pc-body { padding: 0 14px 14px; }

  .print-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; padding: 4px 10px; border-radius: var(--radius-pill); margin-top: 6px; }
  .print-badge.done { background: var(--ok); color: #fff; }
  .print-badge.pending { background: var(--paper); color: var(--ink-soft); border: 1px solid var(--line); }

  .color-order-rows { border-top: 1px solid var(--line); margin-bottom: 4px; }
  .color-order-row { display: grid; grid-template-columns: 16px 56px 1fr 56px auto; gap: 8px; align-items: center; padding: 9px 0; border-bottom: 1px dashed var(--line); }
  .color-order-row:last-child { border-bottom: 1px solid var(--line); margin-bottom: 12px; }
  .color-order-row .col-label { font-size: 13px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .color-order-row input[type=text], .color-order-row input[type=number] {
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 9px; font-size: 13.5px; font-family: var(--font-body); background: var(--paper); color: var(--ink); width: 100%;
  }
  .color-order-row input[type=number] { text-align: center; }
  .color-order-row button { white-space: nowrap; }

  .cust-list { border-top: 1px solid var(--line); padding-top: 4px; }
  .cust-row { display: flex; align-items: center; gap: 10px; padding: 8px 2px; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  .cust-row:last-child { border-bottom: none; }
  .cust-row .swatch { width: 14px; height: 14px; border-radius: 4px; border: 1px solid rgba(0,0,0,0.15); flex-shrink: 0; }
  .cust-row .cr-name { flex: 1; min-width: 0; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cust-row .cr-color { color: var(--ink-soft); font-size: 12.5px; white-space: nowrap; }
  .cust-row .cr-qty { font-family: var(--font-display); font-weight: 700; min-width: 20px; text-align: right; }
  .cust-row .cr-del { border: none; background: none; color: var(--ink-soft); cursor: pointer; font-size: 15px; padding: 2px 4px; line-height: 1; }
  .cust-row .cr-del:hover { color: var(--stitch); }
  .pc-empty-list { font-size: 12.5px; color: var(--ink-soft); padding: 6px 2px 2px; }
  .pc-footer { display: flex; align-items: center; justify-content: flex-end; padding-top: 10px; }
  .pc-total { font-size: 13px; color: var(--ink-soft); }
  .pc-total b { color: var(--ink); font-family: var(--font-display); font-size: 15px; }

  button.btn { font-family: var(--font-body); font-weight: 600; font-size: 13.5px; border-radius: var(--radius-pill); padding: 9px 16px; border: 1px solid transparent; cursor: pointer; }
  button.btn.primary { background: var(--denim); color: #fff; }
  button.btn.ghost { background: none; border-color: var(--line); color: var(--ink); }
  button.btn.danger { background: none; border-color: var(--stitch); color: var(--stitch); }
  button.btn.danger:hover { background: var(--stitch); color: #fff; }
  button.btn.small { padding: 6px 12px; font-size: 12px; }
  button.btn:disabled { opacity: .5; cursor: default; }
  button.btn.saved { background: var(--ok); }
  button.btn.full { width: 100%; }

  .agg-date-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .agg-date-bar label { font-size: 13px; color: var(--ink-soft); }
  .agg-date-bar select { font-family: var(--font-body); font-size: 14px; font-weight: 600; color: var(--ink); background: var(--paper-raised); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
  .daily-strip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 18px; }
  .daily-chip { flex-shrink: 0; background: var(--paper-raised); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; cursor: pointer; text-align: left; font-family: var(--font-body); }
  .daily-chip.active { border-color: var(--stitch); background: var(--thread-soft); }
  .daily-chip .dc-date { font-size: 11.5px; color: var(--ink-soft); }
  .daily-chip .dc-total { font-family: var(--font-display); font-weight: 700; font-size: 16px; }
  .agg-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin-bottom: 20px; }
  .agg-stat { background: var(--paper-raised); border: 1px solid var(--line); border-radius: var(--radius-tag); padding: 14px; }
  .agg-stat .num { font-family: var(--font-display); font-size: 24px; font-weight: 700; }
  .agg-stat .lbl { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }

  .agg-product { background: var(--paper-raised); border: 1px solid var(--line); border-radius: var(--radius-tag); margin-bottom: 14px; overflow: hidden; }
  .agg-product-head { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
  .agg-product-head img { width: 44px; height: 44px; border-radius: 7px; object-fit: cover; border: 1px solid var(--line); flex-shrink: 0; }
  .agg-product-head .apn { flex: 1; min-width: 0; }
  .agg-product-head .apn .name { font-family: var(--font-display); font-weight: 600; font-size: 15px; }
  .agg-product-head .apn .sub { font-size: 12px; color: var(--ink-soft); }
  .agg-color-tally { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 14px 12px; }
  .tally-pill { display: flex; align-items: center; gap: 6px; background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-pill); padding: 5px 10px; font-size: 12.5px; }
  .tally-pill .swatch { width: 12px; height: 12px; border-radius: 3px; }
  .tally-pill b { font-family: var(--font-display); }
  .agg-toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-top: 1px solid var(--line); background: var(--paper); }
  .agg-toggle-row .total-lbl { font-size: 13px; color: var(--ink-soft); }
  .agg-toggle-row .total-lbl b { font-family: var(--font-display); color: var(--ink); font-size: 16px; }
  .cust-detail { padding: 4px 14px 12px; }
  .cust-detail .cd-row { display: flex; gap: 10px; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 13px; align-items: center; }
  .cust-detail .cd-row:last-child { border-bottom: none; }
  .cust-detail .cd-name { flex: 1; font-weight: 500; }
  .cust-detail .cd-meta { color: var(--ink-soft); font-size: 12px; white-space: nowrap; }

  .manage-form { background: var(--paper-raised); border: 1px solid var(--line); border-radius: var(--radius-tag); padding: 18px; margin-bottom: 22px; box-shadow: var(--shadow-card); }
  .manage-form h2 { font-family: var(--font-display); font-size: 16px; margin: 0 0 14px; }
  .field-row { margin-bottom: 12px; }
  .field-row label { display: block; font-size: 13px; color: var(--ink-soft); margin-bottom: 5px; }
  .field-row input[type=text] { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; font-size: 14px; font-family: var(--font-body); background: var(--paper); color: var(--ink); }
  .img-hint { font-size: 12px; color: var(--ink-soft); margin: 6px 0 0; line-height: 1.5; }

  /* Khung preview ảnh bên trái */
  .product-form-layout { display: flex; gap: 16px; align-items: flex-start; margin-bottom: 12px; }
  .img-preview-side {
    width: 110px; height: 110px; border-radius: 10px; border: 1.5px dashed var(--line);
    background: var(--paper); flex-shrink: 0; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 6px; cursor: pointer;
  }
  .img-preview-side img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; display: block; }
  .img-preview-side .pv-placeholder { font-size: 11px; color: var(--ink-soft); line-height: 1.35; }
  .img-preview-side .pv-error { font-size: 10.5px; color: var(--stitch); font-weight: 600; line-height: 1.25; }
  .form-fields-side { flex: 1; min-width: 0; }
  .form-fields-side .field-row:last-child { margin-bottom: 0; }

  @media (max-width: 480px) {
    .product-form-layout { flex-direction: column; }
    .img-preview-side { width: 100%; height: 130px; }
  }

  .manage-list-item { display: flex; align-items: center; gap: 12px; padding: 10px 4px; border-bottom: 1px solid var(--line); }
  .manage-list-item:last-child { border-bottom: none; }
  .manage-list-item img { width: 44px; height: 44px; border-radius: 7px; object-fit: cover; flex-shrink: 0; border: 1px solid var(--line); }
  .manage-list-item .mli-info { flex: 1; min-width: 0; }
  .manage-list-item .mli-name { font-weight: 600; font-size: 14px; }
  .manage-list-item .mli-colors { font-size: 12px; color: var(--ink-soft); }
  .manage-list-item.is-hidden { opacity: 0.55; }
  .manage-list-item .mli-actions { display: flex; gap: 6px; flex-wrap: wrap; flex-shrink: 0; }
  .hidden-tag { font-size: 10px; font-weight: 700; color: var(--ink-soft); background: var(--paper); border: 1px solid var(--line); padding: 2px 7px; border-radius: var(--radius-pill); vertical-align: middle; }

  .acct-row { display: flex; align-items: center; gap: 10px; padding: 10px 4px; border-bottom: 1px solid var(--line); font-size: 13.5px; flex-wrap: wrap; }
  .acct-row:last-child { border-bottom: none; }
  .acct-row .acct-name { font-weight: 600; flex: 1; min-width: 120px; }
  .acct-row .acct-name .you-tag { font-weight: 400; color: var(--ink-soft); font-size: 12px; }
  .acct-row .acct-actions { display: flex; gap: 6px; flex-wrap: wrap; }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: var(--radius-pill); font-size: 13.5px; opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease; z-index: 50; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .setup-warning { background: #fff3cd; color: #6b4a00; border: 1px solid #e3c26b; border-radius: var(--radius-tag); padding: 16px; margin: 20px 0; font-size: 13.5px; line-height: 1.6; }

  .hidden { display: none !important; }

  /* ---- shop-style browsing ---- */
  .shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 14px; margin-top: 4px; }
  .shop-card { background: var(--paper-raised); border: 1px solid var(--line); border-radius: var(--radius-tag); box-shadow: var(--shadow-card); overflow: hidden; cursor: pointer; display: flex; flex-direction: column; transition: transform .1s ease; }
  .shop-card:active { transform: scale(0.98); }
  .shop-card .sc-imgwrap { position: relative; width: 100%; aspect-ratio: 1; background: var(--paper); overflow: hidden; }
  .shop-card .sc-imgwrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .shop-card .sc-badge { position: absolute; top: 7px; left: 7px; font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: var(--radius-pill); }
  .shop-card .sc-badge.done { background: var(--ok); color: #fff; }
  .shop-card .sc-badge.pending { background: rgba(255,255,255,0.92); color: var(--ink-soft); }
  .shop-card .sc-body { padding: 10px 11px 12px; flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .shop-card .sc-name { font-size: 13px; font-weight: 600; line-height: 1.35; }
  .shop-card .sc-sub { font-size: 11.5px; color: var(--ink-soft); display: flex; justify-content: space-between; align-items: center; }
  .shop-card .sc-sub .hot-tag { color: var(--stitch); font-weight: 700; }
  .shop-card .sc-mine { font-size: 11.5px; color: var(--ink-soft); margin-top: auto; }
  .shop-card .sc-mine b { color: var(--stitch); }

  .modal-overlay { position: fixed; inset: 0; background: rgba(20,18,14,0.55); z-index: 90; display: flex; align-items: flex-end; justify-content: center; padding: 0; }
  @media (min-width: 560px) { .modal-overlay { align-items: center; padding: 20px; } }
  .modal-sheet { background: var(--paper-raised); width: 100%; max-width: 440px; max-height: 88vh; overflow-y: auto; border-radius: 18px 18px 0 0; padding: 20px 20px calc(20px + env(safe-area-inset-bottom, 0px)); box-shadow: var(--shadow-card); }
  @media (min-width: 560px) { .modal-sheet { border-radius: var(--radius-tag); max-height: 85vh; } }
  .modal-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  .modal-head h2 { font-family: var(--font-display); font-size: 17px; margin: 0; }
  .ms-close { border: none; background: var(--paper); color: var(--ink-soft); width: 30px; height: 30px; border-radius: 50%; font-size: 15px; cursor: pointer; flex-shrink: 0; }
  .ms-image { width: 100%; max-height: 220px; object-fit: cover; border-radius: 10px; margin-bottom: 10px; cursor: zoom-in; }
  .ms-section-label { font-size: 12.5px; color: var(--ink-soft); margin: 14px 0 8px; }
  .ms-colors { display: flex; gap: 8px; flex-wrap: wrap; }
  .color-chip { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--line); border-radius: var(--radius-pill); padding: 7px 13px; font-size: 13px; cursor: pointer; background: var(--paper); color: var(--ink); }
  .color-chip .swatch { width: 13px; height: 13px; border-radius: 4px; border: 1px solid rgba(0,0,0,0.15); }
  .color-chip.active { border-color: var(--denim); box-shadow: 0 0 0 1.5px var(--denim) inset; font-weight: 600; background: var(--paper-raised); }
  .ms-field { margin-top: 16px; }
  .ms-field label { display: block; font-size: 12.5px; color: var(--ink-soft); margin-bottom: 6px; }
  .ms-field input[type=text] { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 14.5px; font-family: var(--font-body); background: var(--paper); color: var(--ink); }
  .qty-stepper { display: flex; align-items: center; gap: 12px; }
  .qty-stepper button { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--paper); font-size: 18px; cursor: pointer; color: var(--ink); line-height: 1; }
  .qty-stepper input { width: 54px; text-align: center; border: 1px solid var(--line); border-radius: 8px; padding: 7px; font-size: 15px; font-family: var(--font-body); background: var(--paper-raised); color: var(--ink); }
  #productModal .btn.full { margin-top: 20px; }
  .qty-color-rows { margin-top: 6px; }
  .qty-color-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px dashed var(--line); }
  .qty-color-row:last-child { border-bottom: none; }
  .qty-color-row .col-label { flex: 1; font-size: 14px; color: var(--ink); }

  .pc-thumb, .agg-product-head img, .manage-list-item img { cursor: zoom-in; }
  .lightbox { position: fixed; inset: 0; background: rgba(20,18,14,0.88); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 24px; padding-top: calc(24px + env(safe-area-inset-top, 0px)); padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); cursor: zoom-out; }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 10px; box-shadow: 0 20px 60px -20px rgba(0,0,0,0.6); }
  .lightbox .lb-close { position: absolute; top: calc(16px + env(safe-area-inset-top, 0px)); right: 16px; background: rgba(255,255,255,0.15); color: #fff; border: none; width: 36px; height: 36px; border-radius: 50%; font-size: 18px; cursor: pointer; }
</style>
</head>
<body>

<div id="authScreen" class="auth-wrap hidden">
  <div class="auth-card">
    <h1><span class="tag-dot"></span>Đặt số lượng may</h1>
    <p class="sub" id="authSub">Nhập tên và mã PIN của bạn. Chưa có tài khoản? Tự đặt PIN mới là tạo tài khoản nhân viên luôn.</p>
    <div class="auth-field"><label>Tên của bạn</label><input type="text" id="authName" placeholder="VD: Lan (Sale 1)"></div>
    <div class="auth-field"><label>Mã PIN (4-8 số hoặc chữ)</label><input type="password" id="authPin" placeholder="••••" inputmode="numeric" maxlength="8"></div>
    <button class="btn primary full" id="authBtn">Đăng nhập / Tạo tài khoản</button>
    <p class="auth-error" id="authError"></p>
    <p class="auth-note" id="authNote"></p>
  </div>
</div>

<div id="appShell" class="app-layout hidden">
  <aside class="sidebar">
    <div class="sidebar-brand"><h1><span class="tag-dot"></span><span>Đặt số lượng may</span></h1></div>
    <nav class="tabs-vertical">
      <button data-tab="order" class="active">Đặt hàng</button>
      <button data-tab="agg" id="tabAggBtn">Tổng hợp</button>
      <button data-tab="manage" id="tabManageBtn">Quản lý mẫu</button>
      <button data-tab="accounts" id="tabAccountsBtn">Tài khoản</button>
    </nav>
    <div class="sidebar-who">
      <span class="who-name" id="whoName"></span>
      <span class="role-chip" id="whoRole"></span>
      <button id="logoutBtn">Đổi tài khoản</button>
    </div>
  </aside>

  <main class="main-content">
    <p class="subtitle main-subtitle">Nhập theo từng khách. Quản lý đánh dấu mẫu nào đã in để báo lại khách.</p>

    <section class="view active" id="view-order">
      <p class="day-note" id="orderDayNote"></p>
      <div id="shopGrid" class="shop-grid"></div>
      <div id="myOrdersToday"></div>
    </section>
    <section class="view" id="view-agg">
      <div class="agg-date-bar"><label>Xem theo:</label><select id="aggDateSelect"></select></div>
      <div id="dailyStrip" class="daily-strip"></div>
      <div id="aggSummary" class="agg-summary"></div>
      <div id="aggProducts"></div>
    </section>
    <section class="view" id="view-manage"><div id="manageContent"></div></section>
    <section class="view" id="view-accounts"><div id="accountsContent"></div></section>
  </main>
</div>

<div class="toast" id="toast"></div>
<div class="lightbox hidden" id="lightbox"><button class="lb-close" id="lbClose">✕</button><img id="lightboxImg" src="" alt=""></div>
<div class="modal-overlay hidden" id="productModal"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script>
(function () {
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyDMWR-sbWSE6rCakn9p6v5WBVaEwvD4Q6U",
    authDomain: "dat-in-ao.firebaseapp.com",
    databaseURL: "https://dat-in-ao-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "dat-in-ao",
  };

  var DEFAULT_COLORS = ['Đen', 'Trắng', 'Vàng', 'Xanh'];
  var COLOR_SWATCH = { 'Đen': '#1a1a1a', 'Trắng': '#f5f5f0', 'Vàng': '#f0c14b', 'Xanh': '#3d6fa8', 'Đỏ': '#b0523f', 'Xám': '#8a8579', 'Hồng': '#e3a8b8', 'Nâu': '#6b4a2f' };
  function swatchColor(name) { return COLOR_SWATCH[name] || '#9a9382'; }

  var configOk = FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.apiKey.indexOf('PASTE') === -1;
  var db = null;
  if (configOk) { firebase.initializeApp(FIREBASE_CONFIG); db = firebase.database(); }

  var products = {};
  var orders = {};
  var printStatus = {};
  var users = {};
  var usersLoaded = false;
  var currentUser = null;
  var currentTab = 'order';
  var openBreakdowns = {};
  var editingProductId = null;
  var selectedAggDate = null;

  function $(id) { return document.getElementById(id); }
  function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
  function toast(msg) { var t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(function () { t.classList.remove('show'); }, 2200); }
  function openLightbox(src) {
    if (!src) return;
    $('lightboxImg').src = src;
    $('lightbox').classList.remove('hidden');
  }
  function closeLightbox() { $('lightbox').classList.add('hidden'); $('lightboxImg').src = ''; }
  $('lightbox').addEventListener('click', closeLightbox);
  $('lbClose').addEventListener('click', function (e) { e.stopPropagation(); closeLightbox(); });
  function bindLightboxes(root) {
    root.querySelectorAll('img[data-lightbox]').forEach(function (img) {
      img.addEventListener('click', function (e) { e.stopPropagation(); openLightbox(img.getAttribute('data-lightbox') || img.src); });
    });
  }
  function slugKey(name) { return (name || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, ''); }
  function todayStr() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function fmtDate(dstr) {
    if (dstr === 'all') return 'Tất cả các ngày';
    var p = dstr.split('-'); if (p.length !== 3) return dstr;
    return p[2] + '/' + p[1] + '/' + p[0] + (dstr === todayStr() ? ' (hôm nay)' : '');
  }
  function isManager() { return !!(currentUser && currentUser.role === 'manager'); }

  function userList() { return Object.keys(users).map(function (id) { return Object.assign({ id: id }, users[id]); }); }
  function findByNameKey(nameKey) { return userList().find(function (u) { return u.nameKey === nameKey; }); }

  function showAuthError(msg) { var e = $('authError'); e.textContent = msg; e.classList.add('show'); }
  function clearAuthError() { $('authError').classList.remove('show'); }

  function renderAuthNote() {
    var count = userList().length;
    $('authNote').textContent = count === 0
      ? 'Chưa có ai đăng ký — người đầu tiên tạo tài khoản ở đây sẽ tự động là Quản lý.'
      : 'Tài khoản mới tạo mặc định là Nhân viên. Nhờ quản lý nâng quyền trong tab "Tài khoản" nếu cần.';
  }

  function attemptAuth() {
    clearAuthError();
    var name = $('authName').value.trim();
    var pin = $('authPin').value.trim();
    if (!name) { showAuthError('Nhập tên của bạn.'); return; }
    if (!pin || pin.length < 4) { showAuthError('Mã PIN cần ít nhất 4 ký tự.'); return; }
    var nameKey = slugKey(name);
    var btn = $('authBtn'); btn.disabled = true;
    var existing = findByNameKey(nameKey);
    if (existing) {
      btn.disabled = false;
      if (existing.pin === pin) { loginAs(existing); }
      else showAuthError('Sai mã PIN cho tên "' + existing.name + '". Nếu quên PIN, nhờ quản lý đặt lại ở tab Tài khoản.');
      return;
    }
    var role = userList().length === 0 ? 'manager' : 'staff';
    db.ref('users').push({ name: name, nameKey: nameKey, pin: pin, role: role, createdAt: Date.now() })
      .then(function (ref) {
        btn.disabled = false;
        loginAs({ id: ref.key, name: name, nameKey: nameKey, pin: pin, role: role });
        toast(role === 'manager' ? 'Đã tạo tài khoản Quản lý đầu tiên!' : 'Đã tạo tài khoản, chào mừng!');
      })
      .catch(function (e) { btn.disabled = false; showAuthError('Lỗi: ' + e.message); });
  }

  function loginAs(u) {
    currentUser = { id: u.id, name: u.name, role: u.role };
    localStorage.setItem('mm_uid', u.id);
    renderShell();
  }
  function logout() {
    currentUser = null;
    localStorage.removeItem('mm_uid');
    $('authName').value = ''; $('authPin').value = '';
    renderShell();
  }
  $('authBtn').addEventListener('click', attemptAuth);
  $('authPin').addEventListener('keydown', function (e) { if (e.key === 'Enter') attemptAuth(); });
  $('authName').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('authPin').focus(); });
  $('logoutBtn').addEventListener('click', logout);

  function renderShell() {
    if (!usersLoaded) return;
    if (!currentUser) {
      $('authScreen').classList.remove('hidden');
      $('appShell').classList.add('hidden');
      renderAuthNote();
      return;
    }
    $('authScreen').classList.add('hidden');
    $('appShell').classList.remove('hidden');
    $('whoName').textContent = currentUser.name;
    $('whoRole').textContent = isManager() ? 'Quản lý' : 'Nhân viên';
    $('whoRole').className = 'role-chip' + (isManager() ? ' manager' : '');
    $('tabAggBtn').classList.toggle('hidden', !isManager());
    $('tabManageBtn').classList.toggle('hidden', !isManager());
    $('tabAccountsBtn').classList.toggle('hidden', !isManager());
    if (!isManager() && (currentTab === 'agg' || currentTab === 'manage' || currentTab === 'accounts')) switchTab('order');
    else renderCurrentTab();
  }

  function renderCurrentTab() {
    if (currentTab === 'order') renderOrderList();
    if (currentTab === 'agg') renderAgg();
    if (currentTab === 'manage') renderManage();
    if (currentTab === 'accounts') renderAccounts();
  }

  function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tabs-vertical button').forEach(function (b) { b.classList.toggle('active', b.dataset.tab === tab); });
    document.querySelectorAll('section.view').forEach(function (v) { v.classList.toggle('active', v.id === 'view-' + tab); });
    renderCurrentTab();
  }
  document.querySelectorAll('.tabs-vertical button').forEach(function (b) { b.addEventListener('click', function () { switchTab(b.dataset.tab); }); });

  function renderAccounts() {
    if (!isManager()) return;
    var el = $('accountsContent');
    var list = userList().sort(function (a, b) { return (a.createdAt || 0) - (b.createdAt || 0); });
    var managerCount = list.filter(function (u) { return u.role === 'manager'; }).length;
    el.innerHTML = '<div class="manage-form"><h2>Tài khoản (' + list.length + ')</h2><div id="acctList"></div>' +
      '<p class="img-hint" style="margin-top:12px;">Nhân viên tự tạo tài khoản ở màn đăng nhập (gõ tên mới + đặt PIN). Ở đây quản lý chỉ nâng quyền / đặt lại PIN / xoá tài khoản.</p></div>';
    var listEl = $('acctList');
    listEl.innerHTML = list.map(function (u) {
      var isYou = u.id === currentUser.id;
      var isLastManager = u.role === 'manager' && managerCount <= 1;
      return '<div class="acct-row" data-uid="' + esc(u.id) + '">' +
        '<span class="acct-name">' + esc(u.name) + (isYou ? ' <span class="you-tag">(bạn)</span>' : '') + '</span>' +
        '<span class="role-chip' + (u.role === 'manager' ? ' manager' : '') + '">' + (u.role === 'manager' ? 'Quản lý' : 'Nhân viên') + '</span>' +
        '<span class="acct-actions">' +
        '<button class="btn ghost small" data-action="toggle-role"' + (isLastManager ? ' disabled title="Cần giữ lại ít nhất 1 quản lý"' : '') + '>' + (u.role === 'manager' ? 'Hạ xuống NV' : 'Nâng lên QL') + '</button>' +
        '<button class="btn ghost small" data-action="reset-pin">Đặt lại PIN</button>' +
        '<button class="btn danger small" data-action="delete"' + (isLastManager ? ' disabled title="Cần giữ lại ít nhất 1 quản lý"' : '') + '>Xoá</button>' +
        '</span></div>';
    }).join('');

    listEl.querySelectorAll('[data-action="toggle-role"]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var uid = btn.closest('.acct-row').dataset.uid;
        var u = users[uid];
        var newRole = u.role === 'manager' ? 'staff' : 'manager';
        db.ref('users/' + uid + '/role').set(newRole).then(function () { toast('Đã đổi quyền.'); }).catch(function () { toast('Lỗi khi đổi quyền.'); });
      });
    });
    listEl.querySelectorAll('[data-action="reset-pin"]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var uid = btn.closest('.acct-row').dataset.uid;
        var newPin = prompt('Nhập mã PIN mới cho tài khoản này (từ 4 ký tự):');
        if (newPin === null) return;
        if (newPin.trim().length < 4) { toast('PIN cần ít nhất 4 ký tự.'); return; }
        db.ref('users/' + uid + '/pin').set(newPin.trim()).then(function () { toast('Đã đặt lại PIN.'); }).catch(function () { toast('Lỗi khi đặt PIN.'); });
      });
    });
    listEl.querySelectorAll('[data-action="delete"]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var uid = btn.closest('.acct-row').dataset.uid;
        var u = users[uid];
        if (!confirm('Xoá tài khoản "' + u.name + '"? Đơn hàng cũ của người này vẫn còn trong lịch sử.')) return;
        db.ref('users/' + uid).remove().then(function () {
          toast('Đã xoá tài khoản.');
          if (uid === currentUser.id) logout();
        }).catch(function () { toast('Lỗi khi xoá.'); });
      });
    });
  }

  function productList() {
    return Object.keys(products).map(function (id) { return Object.assign({ id: id }, products[id]); })
      .sort(function (a, b) { return (a.createdAt || 0) - (b.createdAt || 0); });
  }
  function colorsOf(p) { return (p.colors && p.colors.length) ? p.colors : DEFAULT_COLORS; }

  // Tính tổng số lượng đặt áo của TẤT CẢ mọi người hôm nay cho từng mẫu
  function productTotalToday(pid) {
    var today = todayStr();
    var pOrders = (orders[today] && orders[today][pid]) || {};
    var total = 0;
    Object.keys(pOrders).forEach(function (uid) {
      var q = pOrders[uid].quantities || {};
      Object.keys(q).forEach(function (c) { total += Number(q[c]) || 0; });
    });
    return total;
  }

  // ---------- order tab: ưu tiên mẫu có nhiều người đặt xếp trên cùng ----------
  var modalProduct = null;

  function renderOrderList() {
    if (!configOk) { $('shopGrid').innerHTML = setupWarningHtml(); return; }
    var plist = productList().filter(function (p) { return !p.hidden; });
    var today = todayStr();
    $('orderDayNote').innerHTML = 'Đơn cho ngày <b>' + fmtDate(today) + '</b>. Mai vào lại sẽ là đợt đặt mới.';
    if (!plist.length) {
      $('shopGrid').innerHTML = '<div class="empty">Chưa có mẫu áo nào.' + (isManager() ? ' Vào tab "Quản lý mẫu" để thêm ảnh mẫu.' : ' Chờ quản lý thêm ảnh mẫu nhé.') + '</div>';
      $('myOrdersToday').innerHTML = '';
      return;
    }
    var todayOrders = orders[today] || {};
    var todayPrint = printStatus[today] || {};

    // Sắp xếp mẫu: mẫu có tổng số áo được đặt nhiều nhất hôm nay xếp lên đầu
    plist.sort(function (a, b) {
      var tA = productTotalToday(a.id);
      var tB = productTotalToday(b.id);
      if (tB !== tA) return tB - tA;
      return (a.createdAt || 0) - (b.createdAt || 0);
    });

    $('shopGrid').innerHTML = plist.map(function (p) {
      var colors = colorsOf(p);
      var mine = (todayOrders[p.id] && todayOrders[p.id][currentUser.id] && todayOrders[p.id][currentUser.id].quantities) || {};
      var mineTotal = colors.reduce(function (s, c) { return s + (Number(mine[c]) || 0); }, 0);
      var totalAll = productTotalToday(p.id);
      var printed = !!(todayPrint[p.id] && todayPrint[p.id].printed);
      return '<div class="shop-card" data-pid="' + esc(p.id) + '">' +
        '<div class="sc-imgwrap">' + (p.imageUrl ? '<img src="' + esc(p.imageUrl) + '" alt="">' : '<div class="pc-thumb placeholder" style="width:100%;height:100%;border-radius:0;">Không ảnh</div>') +
        '<span class="sc-badge ' + (printed ? 'done' : 'pending') + '">' + (printed ? '✅ Đã in' : '⏳ Chưa in') + '</span>' +
        '</div>' +
        '<div class="sc-body">' +
          '<div class="sc-name">' + esc(p.name) + '</div>' +
          '<div class="sc-sub">' +
            '<span>' + colors.length + ' màu</span>' +
            (totalAll > 0 ? '<span class="hot-tag">🔥 Đã đặt: ' + totalAll + '</span>' : '') +
          '</div>' +
          (mineTotal ? '<div class="sc-mine">Bạn đã đặt <b>' + mineTotal + '</b> áo</div>' : '<div class="sc-mine" style="opacity:0.6;">Chưa đặt</div>') +
        '</div></div>';
    }).join('');
    $('shopGrid').querySelectorAll('.shop-card').forEach(function (card) {
      card.addEventListener('click', function () { openProductModal(card.dataset.pid); });
    });
    renderMyOrdersToday();
  }

  function renderMyOrdersToday() {
    var container = $('myOrdersToday');
    var today = todayStr();
    var todayOrders = orders[today] || {};
    var rows = [];
    Object.keys(todayOrders).forEach(function (pid) {
      var mine = todayOrders[pid][currentUser.id];
      if (!mine) return;
      var total = Object.values(mine.quantities || {}).reduce(function (s, v) { return s + (Number(v) || 0); }, 0);
      if (total <= 0) return;
      rows.push({ pid: pid, quantities: mine.quantities || {}, total: total });
    });
    if (!rows.length) { container.innerHTML = ''; return; }
    var grand = rows.reduce(function (s, r) { return s + r.total; }, 0);
    container.innerHTML = '<div class="manage-form" style="margin-top:24px;"><h2>Đơn của bạn hôm nay (' + grand + ' áo)</h2><div class="cust-list">' +
      rows.map(function (r) {
        var p = products[r.pid];
        var pname = p ? p.name : '(mẫu đã xoá)';
        var breakdown = Object.keys(r.quantities).filter(function (c) { return r.quantities[c] > 0; })
          .map(function (c) { return esc(c) + ' × ' + r.quantities[c]; }).join(', ');
        return '<div class="cust-row"><span class="cr-name">' + esc(pname) + '</span>' +
          '<span class="cr-color">' + breakdown + '</span>' +
          '<span class="cr-qty">' + r.total + '</span></div>';
      }).join('') + '</div><p class="img-hint">Bấm vào mẫu áo ở trên để sửa lại số lượng.</p></div>';
  }

  function openProductModal(pid) {
    if (!products[pid]) return;
    modalProduct = Object.assign({ id: pid }, products[pid]);
    renderProductModal();
    $('productModal').classList.remove('hidden');
  }
  function closeProductModal() { $('productModal').classList.add('hidden'); $('productModal').innerHTML = ''; modalProduct = null; }

  function renderProductModal() {
    var p = modalProduct;
    var colors = colorsOf(p);
    var today = todayStr();
    var printed = !!(printStatus[today] && printStatus[today][p.id] && printStatus[today][p.id].printed);
    var mine = (orders[today] && orders[today][p.id] && orders[today][p.id][currentUser.id] && orders[today][p.id][currentUser.id].quantities) || {};
    var html = '<div class="modal-sheet">' +
      '<div class="modal-head"><h2>' + esc(p.name) + '</h2><button class="ms-close" id="msCloseBtn">✕</button></div>' +
      (p.imageUrl ? '<img class="ms-image" data-lightbox="' + esc(p.imageUrl) + '" src="' + esc(p.imageUrl) + '" alt="">' : '') +
      '<span class="print-badge ' + (printed ? 'done' : 'pending') + '">' + (printed ? '✅ Đã in — báo khách nhận hàng' : '⏳ Chưa in') + '</span>' +
      '<div class="ms-section-label">Số lượng theo màu</div>' +
      '<div class="qty-color-rows">' + colors.map(function (c) {
        var v = mine[c] != null ? mine[c] : 0;
        return '<div class="qty-color-row" data-color="' + esc(c) + '">' +
          '<span class="swatch" style="background:' + swatchColor(c) + '"></span>' +
          '<span class="col-label">' + esc(c) + '</span>' +
          '<div class="qty-stepper"><button data-action="dec" type="button">−</button><input type="number" class="qc-input" value="' + v + '" min="0"><button data-action="inc" type="button">+</button></div>' +
          '</div>';
      }).join('') + '</div>' +
      '<button class="btn primary full" id="msSaveBtn">Lưu số lượng</button>' +
      '</div>';
    $('productModal').innerHTML = html;
    bindLightboxes($('productModal'));
    $('msCloseBtn').addEventListener('click', closeProductModal);
    $('productModal').querySelectorAll('.qty-color-row').forEach(function (row) {
      var input = row.querySelector('.qc-input');
      row.querySelector('[data-action="dec"]').addEventListener('click', function () { input.value = Math.max(0, (Number(input.value) || 0) - 1); });
      row.querySelector('[data-action="inc"]').addEventListener('click', function () { input.value = (Number(input.value) || 0) + 1; });
    });
    $('msSaveBtn').addEventListener('click', saveProductQuantities);
  }

  function saveProductQuantities() {
    var p = modalProduct;
    var quantities = {};
    $('productModal').querySelectorAll('.qty-color-row').forEach(function (row) {
      var c = row.dataset.color;
      var v = Math.max(0, Math.floor(Number(row.querySelector('.qc-input').value) || 0));
      quantities[c] = v;
    });
    var btn = $('msSaveBtn'); btn.disabled = true; btn.textContent = 'Đang lưu…';
    db.ref('orders/' + todayStr() + '/' + p.id + '/' + currentUser.id).set({
      employeeName: currentUser.name, quantities: quantities, updatedAt: Date.now()
    }).then(function () {
      toast('Đã lưu số lượng cho "' + p.name + '".');
      closeProductModal();
    }).catch(function (e) { btn.disabled = false; btn.textContent = 'Lưu số lượng'; toast('Lỗi: ' + e.message); });
  }

  $('productModal').addEventListener('click', function (e) { if (e.target === $('productModal')) closeProductModal(); });

  function availableDates() {
    var dates = Object.keys(orders).sort().reverse();
    return dates.length ? dates : [todayStr()];
  }
  function mergedProductOrders(productId, dates) {
    var out = {};
    dates.forEach(function (d) {
      var dayNode = (orders[d] && orders[d][productId]) || {};
      Object.keys(dayNode).forEach(function (empKey) {
        var o = dayNode[empKey];
        if (!out[empKey]) out[empKey] = { employeeName: o.employeeName, quantities: {} };
        Object.keys(o.quantities || {}).forEach(function (c) {
          out[empKey].quantities[c] = (out[empKey].quantities[c] || 0) + (Number(o.quantities[c]) || 0);
        });
      });
    });
    return out;
  }
  function dayGrandTotal(d) {
    var t = 0;
    var dayNode = orders[d] || {};
    Object.keys(dayNode).forEach(function (pid) {
      Object.keys(dayNode[pid]).forEach(function (empKey) {
        Object.values(dayNode[pid][empKey].quantities || {}).forEach(function (v) { t += Number(v) || 0; });
      });
    });
    return t;
  }
  function renderAggDateControls() {
    if (!selectedAggDate) selectedAggDate = todayStr();
    var dates = availableDates();
    if (dates.indexOf(selectedAggDate) === -1 && selectedAggDate !== 'all') selectedAggDate = dates[0];
    var sel = $('aggDateSelect');
    var opts = dates.map(function (d) { return '<option value="' + d + '"' + (d === selectedAggDate ? ' selected' : '') + '>' + fmtDate(d) + '</option>'; }).join('');
    opts += '<option value="all"' + (selectedAggDate === 'all' ? ' selected' : '') + '>Tất cả các ngày (gộp)</option>';
    sel.innerHTML = opts;
    sel.onchange = function () { selectedAggDate = sel.value; renderAgg(); };

    var strip = $('dailyStrip');
    var today = todayStr();
    strip.innerHTML = dates.slice(0, 14).map(function (d) {
      return '<button class="daily-chip' + (d === selectedAggDate ? ' active' : '') + '" data-date="' + d + '">' +
        '<div class="dc-date">' + (d === today ? 'Hôm nay' : fmtDate(d).replace(' (hôm nay)', '')) + '</div>' +
        '<div class="dc-total">' + dayGrandTotal(d) + '</div></button>';
    }).join('');
    strip.querySelectorAll('.daily-chip').forEach(function (btn) { btn.addEventListener('click', function () { selectedAggDate = btn.dataset.date; renderAgg(); }); });
  }

  // ---------- aggregate tab: ưu tiên mẫu có nhiều người đặt xếp trên cùng ----------
  function renderAgg() {
    if (!isManager()) return;
    var summaryEl = $('aggSummary'), prodEl = $('aggProducts');
    if (!configOk) { summaryEl.innerHTML = ''; prodEl.innerHTML = ''; return; }
    var plist = productList();
    renderAggDateControls();
    if (!plist.length) { summaryEl.innerHTML = ''; prodEl.innerHTML = '<div class="empty">Chưa có mẫu áo hoặc đơn hàng nào.</div>'; return; }

    var dates = selectedAggDate === 'all' ? availableDates() : [selectedAggDate];
    var singleDate = dates.length === 1 ? dates[0] : null;

    var grandTotal = 0, peopleSet = {};
    var byProduct = {}; // productId -> { byColor, byPerson, totalQty }
    plist.forEach(function (p) {
      var merged = mergedProductOrders(p.id, dates);
      var colors = colorsOf(p);
      var byColor = {}, byPerson = {}, pTotalQty = 0;
      Object.keys(merged).forEach(function (empKey) {
        var o = merged[empKey];
        var pTotal = 0;
        colors.forEach(function (c) { var v = Number(o.quantities[c]) || 0; if (v > 0) { byColor[c] = (byColor[c] || 0) + v; pTotal += v; } });
        if (pTotal > 0) { byPerson[empKey] = { employeeName: o.employeeName, total: pTotal, quantities: o.quantities }; peopleSet[empKey] = true; grandTotal += pTotal; pTotalQty += pTotal; }
      });
      if (pTotalQty > 0) byProduct[p.id] = { byColor: byColor, byPerson: byPerson, totalQty: pTotalQty };
    });

    summaryEl.innerHTML = '<div class="agg-stat"><div class="num">' + grandTotal + '</div><div class="lbl">Tổng số áo · ' + esc(fmtDate(selectedAggDate)) + '</div></div>' +
      '<div class="agg-stat"><div class="num">' + Object.keys(byProduct).length + '</div><div class="lbl">Mẫu có đơn</div></div>' +
      '<div class="agg-stat"><div class="num">' + Object.keys(peopleSet).length + '</div><div class="lbl">Sale đã đặt</div></div>';

    if (!Object.keys(byProduct).length) { prodEl.innerHTML = '<div class="empty">Chưa có đơn hàng nào cho ' + esc(fmtDate(selectedAggDate).toLowerCase()) + '.</div>'; return; }

    // Sắp xếp các mẫu có tổng số áo được đặt từ cao nhất xuống thấp nhất
    var filteredList = plist.filter(function (p) { return byProduct[p.id]; });
    filteredList.sort(function (a, b) {
      return (byProduct[b.id].totalQty || 0) - (byProduct[a.id].totalQty || 0);
    });

    var html = '';
    filteredList.forEach(function (p) {
      var pdata = byProduct[p.id];
      var colors = colorsOf(p);
      var printed = singleDate ? !!(printStatus[singleDate] && printStatus[singleDate][p.id] && printStatus[singleDate][p.id].printed) : false;
      var rowTotal = pdata.totalQty;
      var personCount = Object.keys(pdata.byPerson).length;
      var showBreak = !!openBreakdowns[p.id];

      html += '<div class="agg-product" data-pid="' + esc(p.id) + '">';
      html += '<div class="agg-product-head">';
      html += p.imageUrl ? '<img data-lightbox="' + esc(p.imageUrl) + '" src="' + esc(p.imageUrl) + '" alt="">' : '';
      html += '<div class="apn"><div class="name">' + esc(p.name) + '</div><div class="sub">' + personCount + ' sale đã đặt</div></div>';
      if (singleDate) {
        html += '<button class="btn small ' + (printed ? 'ghost' : 'primary') + '" data-action="toggle-print">' + (printed ? '✅ Đã in' : 'Đánh dấu đã in') + '</button>';
      }
      html += '</div>';
      html += '<div class="agg-color-tally">' + colors.filter(function (c) { return pdata.byColor[c]; }).map(function (c) {
        return '<div class="tally-pill"><span class="swatch" style="background:' + swatchColor(c) + '"></span>' + esc(c) + ': <b>' + pdata.byColor[c] + '</b></div>';
      }).join('') + '</div>';
      html += '<div class="agg-toggle-row"><span class="total-lbl">Tổng mẫu này: <b>' + rowTotal + '</b></span>' +
        '<button class="breakdown-toggle-btn btn ghost small" data-action="toggle-detail">' + (showBreak ? 'Ẩn theo Sale' : 'Xem theo Sale') + '</button></div>';
      if (showBreak) {
        var people = Object.keys(pdata.byPerson).map(function (k) { return pdata.byPerson[k]; }).sort(function (a, b) { return b.total - a.total; });
        html += '<div class="cust-detail">' + people.map(function (person) {
          var breakdown = colors.filter(function (c) { return person.quantities[c] > 0; }).map(function (c) { return esc(c) + ' × ' + person.quantities[c]; }).join(', ');
          return '<div class="cd-row"><span class="cd-name">' + esc(person.employeeName || 'Không tên') + '</span>' +
            '<span class="cd-meta">' + breakdown + ' · <b>' + person.total + '</b></span></div>';
        }).join('') + '</div>';
      }
      html += '</div>';
    });
    prodEl.innerHTML = html;
    bindLightboxes(prodEl);

    prodEl.querySelectorAll('[data-action="toggle-detail"]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var pid = btn.closest('.agg-product').dataset.pid;
        openBreakdowns[pid] = !openBreakdowns[pid];
        renderAgg();
      });
    });
    prodEl.querySelectorAll('[data-action="toggle-print"]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var pid = btn.closest('.agg-product').dataset.pid;
        togglePrintStatus(pid);
      });
    });
  }

  function togglePrintStatus(productId) {
    if (!isManager() || selectedAggDate === 'all') return;
    var d = selectedAggDate;
    var cur = !!(printStatus[d] && printStatus[d][productId] && printStatus[d][productId].printed);
    db.ref('printStatus/' + d + '/' + productId).set({ printed: !cur, printedAt: Date.now(), printedBy: currentUser.name })
      .then(function () { toast(!cur ? 'Đã đánh dấu: đã in.' : 'Đã bỏ đánh dấu.'); })
      .catch(function () { toast('Không cập nhật được.'); });
  }

  function renderManage() {
    if (!isManager()) return;
    var el = $('manageContent');
    if (!configOk) { el.innerHTML = setupWarningHtml(); return; }
    var plist = productList();
    el.innerHTML =
      '<div class="manage-form"><h2>Thêm mẫu áo mới</h2>' +
      '<div class="product-form-layout">' +
        '<div class="img-preview-side" id="newImgPreviewBox">' +
          '<div class="pv-placeholder">🖼️ Xem trước ảnh bên trái</div>' +
        '</div>' +
        '<div class="form-fields-side">' +
          '<div class="field-row">' +
            '<label>Link ảnh mẫu</label>' +
            '<input type="text" id="imgUrlInput" placeholder="Dán link ảnh https://...">' +
          '</div>' +
          '<div class="field-row">' +
            '<label>Tên mẫu</label>' +
            '<input type="text" id="nameInput" placeholder="VD: Áo hoodie gấu bông">' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="field-row"><label>Các màu (cách nhau bằng dấu phẩy)</label><input type="text" id="colorsInput" value="' + DEFAULT_COLORS.join(', ') + '"></div>' +
      '<button class="btn primary" id="addProductBtn">Thêm mẫu</button>' +
      '<p class="img-hint" style="margin-top:10px;">Link ảnh từ Imgur, Postimages, Google Drive, Shopee, Facebook... vừa dán vào ô là hình sẽ hiện ngay ở khung bên trái.</p>' +
      '</div>' +
      '<div class="manage-form"><h2>Mẫu áo hiện có (' + plist.length + ')</h2><div id="productListManage"></div></div>';

    var imgInput = $('imgUrlInput');
    function updateNewPreview() {
      var url = imgInput.value.trim();
      var box = $('newImgPreviewBox');
      if (url) {
        box.innerHTML = '<img src="' + esc(url) + '" data-lightbox="' + esc(url) + '" onerror="this.outerHTML=\'<div class=\\\'pv-error\\\'>❌ Link ảnh lỗi hoặc không tải được</div>\'">';
        bindLightboxes(box);
      } else {
        box.innerHTML = '<div class="pv-placeholder">🖼️ Xem trước ảnh bên trái</div>';
      }
    }
    imgInput.addEventListener('input', updateNewPreview);
    imgInput.addEventListener('change', updateNewPreview);

    $('addProductBtn').addEventListener('click', addProduct);

    var listEl = $('productListManage');
    if (!plist.length) { listEl.innerHTML = '<div class="empty">Chưa có mẫu nào.</div>'; }
    else {
      listEl.innerHTML = plist.map(function (p) {
        if (p.id === editingProductId) return renderEditProductForm(p);
        var colors = colorsOf(p);
        var hidden = !!p.hidden;
        return '<div class="manage-list-item' + (hidden ? ' is-hidden' : '') + '">' +
          (p.imageUrl ? '<img data-lightbox="' + esc(p.imageUrl) + '" src="' + esc(p.imageUrl) + '" alt="">' : '<div class="pc-thumb placeholder" style="width:44px;height:44px;font-size:9px;">–</div>') +
          '<div class="mli-info"><div class="mli-name">' + esc(p.name) + (hidden ? ' <span class="hidden-tag">Đang ẩn</span>' : '') + '</div><div class="mli-colors">' + colors.join(', ') + '</div></div>' +
          '<div class="mli-actions">' +
          '<button class="btn ghost small" data-action="edit" data-pid="' + esc(p.id) + '">Sửa</button>' +
          '<button class="btn ghost small" data-action="toggle-hide" data-pid="' + esc(p.id) + '">' + (hidden ? 'Hiện lại' : 'Ẩn') + '</button>' +
          '<button class="btn danger small" data-action="delete" data-pid="' + esc(p.id) + '">Xoá</button>' +
          '</div></div>';
      }).join('');
      listEl.querySelectorAll('[data-action="delete"]').forEach(function (btn) { btn.addEventListener('click', function () { deleteProduct(btn.dataset.pid); }); });
      listEl.querySelectorAll('[data-action="edit"]').forEach(function (btn) { btn.addEventListener('click', function () { startEditProduct(btn.dataset.pid); }); });
      listEl.querySelectorAll('[data-action="toggle-hide"]').forEach(function (btn) {
        btn.addEventListener('click', function () { toggleProductHidden(btn.dataset.pid, products[btn.dataset.pid].hidden); });
      });
      bindEditFormEvents(listEl);
      bindLightboxes(listEl);
    }
  }

  function renderEditProductForm(p) {
    var colors = colorsOf(p);
    return '<div class="manage-form edit-product-form" data-editing-pid="' + esc(p.id) + '" style="margin:10px 0;">' +
      '<div class="product-form-layout">' +
        '<div class="img-preview-side" id="editImgPreviewBox">' +
          (p.imageUrl ? '<img src="' + esc(p.imageUrl) + '" data-lightbox="' + esc(p.imageUrl) + '">' : '<div class="pv-placeholder">🖼️ Xem trước ảnh bên trái</div>') +
        '</div>' +
        '<div class="form-fields-side">' +
          '<div class="field-row">' +
            '<label>Link ảnh mẫu</label>' +
            '<input type="text" id="editImgUrlInput" placeholder="https://..." value="' + esc(p.imageUrl || '') + '">' +
          '</div>' +
          '<div class="field-row">' +
            '<label>Tên mẫu</label>' +
            '<input type="text" id="editNameInput" value="' + esc(p.name) + '">' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="field-row"><label>Các màu (cách nhau bằng dấu phẩy)</label><input type="text" id="editColorsInput" value="' + esc(colors.join(', ')) + '"></div>' +
      '<div style="display:flex; gap:8px;">' +
      '<button class="btn primary" id="saveEditBtn" data-pid="' + esc(p.id) + '">Lưu thay đổi</button>' +
      '<button class="btn ghost" id="cancelEditBtn">Huỷ</button>' +
      '</div></div>';
  }

  function bindEditFormEvents(listEl) {
    var form = listEl.querySelector('.edit-product-form');
    if (!form) return;
    
    var editImgInput = $('editImgUrlInput');
    function updateEditPreview() {
      var url = editImgInput.value.trim();
      var box = $('editImgPreviewBox');
      if (url) {
        box.innerHTML = '<img src="' + esc(url) + '" data-lightbox="' + esc(url) + '" onerror="this.outerHTML=\'<div class=\\\'pv-error\\\'>❌ Link ảnh lỗi</div>\'">';
        bindLightboxes(box);
      } else {
        box.innerHTML = '<div class="pv-placeholder">🖼️ Xem trước ảnh bên trái</div>';
      }
    }
    editImgInput.addEventListener('input', updateEditPreview);
    editImgInput.addEventListener('change', updateEditPreview);

    $('cancelEditBtn').addEventListener('click', function () { editingProductId = null; renderManage(); });
    $('saveEditBtn').addEventListener('click', function () { saveEditProduct(form.dataset.editingPid); });
  }

  function startEditProduct(pid) {
    editingProductId = pid;
    renderManage();
  }

  function saveEditProduct(pid) {
    var name = $('editNameInput').value.trim();
    var colorsRaw = $('editColorsInput').value.trim();
    var colors = colorsRaw.split(',').map(function (s) { return s.trim(); }).filter(Boolean);
    if (!colors.length) colors = DEFAULT_COLORS.slice();
    if (!name) { toast('Nhập tên mẫu áo.'); return; }
    var imageUrl = $('editImgUrlInput').value.trim();
    if (!imageUrl) { toast('Thêm link ảnh mẫu áo trước đã.'); return; }
    var btn = $('saveEditBtn'); btn.disabled = true; btn.textContent = 'Đang lưu…';
    db.ref('products/' + pid).update({ name: name, imageUrl: imageUrl, colors: colors })
      .then(function () {
        editingProductId = null;
        toast('Đã cập nhật mẫu áo.'); renderManage();
      })
      .catch(function (e) { btn.disabled = false; btn.textContent = 'Lưu thay đổi'; toast('Lỗi: ' + e.message); });
  }

  function toggleProductHidden(pid, currentlyHidden) {
    db.ref('products/' + pid + '/hidden').set(!currentlyHidden)
      .then(function () { toast(!currentlyHidden ? 'Đã ẩn mẫu áo khỏi tab Đặt hàng.' : 'Đã hiện lại mẫu áo.'); })
      .catch(function () { toast('Không cập nhật được.'); });
  }

  function addProduct() {
    if (!isManager()) return;
    var name = $('nameInput').value.trim();
    var colorsRaw = $('colorsInput').value.trim();
    var colors = colorsRaw.split(',').map(function (s) { return s.trim(); }).filter(Boolean);
    if (!colors.length) colors = DEFAULT_COLORS.slice();
    if (!name) { toast('Nhập tên mẫu áo.'); return; }
    var imageUrl = $('imgUrlInput').value.trim();
    if (!imageUrl) { toast('Thêm link ảnh mẫu áo trước đã.'); return; }
    var btn = $('addProductBtn'); btn.disabled = true; btn.textContent = 'Đang lưu…';
    db.ref('products').push({ name: name, imageUrl: imageUrl, colors: colors, createdAt: Date.now() })
      .then(function () { toast('Đã thêm mẫu áo.'); renderManage(); })
      .catch(function (e) { btn.disabled = false; btn.textContent = 'Thêm mẫu'; toast('Lỗi: ' + e.message); });
  }

  function deleteProduct(pid) {
    if (!isManager()) return;
    if (!confirm('Xoá mẫu áo này? Các đơn khách đã nhập cho mẫu này vẫn còn trong lịch sử nhưng sẽ không hiện được ảnh/tên nữa.')) return;
    db.ref('products/' + pid).remove().then(function () { toast('Đã xoá mẫu áo.'); }).catch(function () { toast('Không xoá được mẫu áo.'); });
  }

  function setupWarningHtml() {
    return '<div class="setup-warning">⚠️ Chưa cấu hình Firebase. Mở file <code>index.html</code>, tìm dòng <code>FIREBASE_CONFIG</code> gần cuối file và dán config từ Firebase Console vào.</div>';
  }

  if (configOk) {
    db.ref('users').on('value', function (snap) {
      users = snap.val() || {};
      usersLoaded = true;
      if (!currentUser) {
        var savedUid = localStorage.getItem('mm_uid');
        if (savedUid && users[savedUid]) {
          currentUser = { id: savedUid, name: users[savedUid].name, role: users[savedUid].role };
        }
      } else if (users[currentUser.id]) {
        currentUser.name = users[currentUser.id].name;
        currentUser.role = users[currentUser.id].role;
      } else {
        currentUser = null;
        localStorage.removeItem('mm_uid');
      }
      renderShell();
    });
    db.ref('products').on('value', function (snap) {
      products = snap.val() || {};
      if (currentUser) renderCurrentTab();
    });
    db.ref('orders').on('value', function (snap) {
      orders = snap.val() || {};
      if (currentUser) renderCurrentTab();
    });
    db.ref('printStatus').on('value', function (snap) {
      printStatus = snap.val() || {};
      if (currentUser) renderCurrentTab();
    });
  } else {
    $('authScreen').classList.remove('hidden');
    $('authSub').innerHTML = '';
    $('authScreen').querySelector('.auth-card').innerHTML = setupWarningHtml();
  }
})();
</script>
</body>
</html>
